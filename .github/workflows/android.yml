name: Android app bundle

on:
  push:
    branches: [main]
    # Build only when the app changes: docs, .scratch, e2e and other workflows do not.
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*'
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'
  # "Run workflow" releases to production: builds a new bundle and uploads it with these notes.
  # (The upload action can't promote an existing closed-testing release, only upload.)
  workflow_dispatch:
    inputs:
      notes_uk:
        description: 'Release notes in Ukrainian (up to 500 characters)'
        required: true
        type: string
      notes_en:
        description: 'Release notes in English (up to 500 characters)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      # Play needs a higher versionCode on every upload (android/app/build.gradle reads it).
      VERSION_CODE: ${{ github.run_number }}
      # The upload key (docs/android-release.md). Secrets cannot be used in `if:`, so they go
      # through env and the "Upload key" step decides whether the bundle is signed.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'
      - uses: gradle/actions/setup-gradle@v6

      # All four secrets: signed. None: unsigned, with a warning (before the wizard has run).
      # Some but not all: fail, since that is a typo in the secrets, not a fresh repo.
      - name: Upload key
        id: key
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -eq 4 ]; then
            echo "::warning title=Unsigned bundle::No upload key secrets are set, so this .aab is unsigned and Play will not accept it. Run the release wizard (docs/android-release.md) to add them."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          elif [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Upload key incomplete::Missing secrets: ${missing[*]}. Set all four or none."
            exit 1
          else
            keystore="$RUNNER_TEMP/upload-key.jks"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
      # VITE_TARGET=android build (with type-check), then cap sync android.
      - run: npm run build:android
      - name: Gradle bundleRelease
        working-directory: android
        run: ./gradlew bundleRelease
      # Fails on location or AD_ID in the merged manifest (Families policy).
      - run: npm run check:android

      - name: Bundle name
        id: name
        env:
          SIGNED: ${{ steps.key.outputs.signed }}
        run: |
          if [ "$SIGNED" = true ]; then
            echo "artifact=teach-clock-${VERSION_CODE}" >> "$GITHUB_OUTPUT"
            echo "Signed \`.aab\`, versionCode ${VERSION_CODE}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "artifact=teach-clock-${VERSION_CODE}-unsigned" >> "$GITHUB_OUTPUT"
            echo "**Unsigned** \`.aab\`, versionCode ${VERSION_CODE}: the upload key secrets are not set, so Play will not accept it." >> "$GITHUB_STEP_SUMMARY"
          fi
      # Kept so the very first upload can be done by hand in Play Console.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-key.jks"

      # Push to main: closed testing (track "alpha"). Run workflow: production.
      # Skipped while PLAY_SERVICE_ACCOUNT_JSON is not set (the first upload is by hand in
      # Play Console; Play's API only accepts uploads once the app exists).
      - name: Play release notes
        id: play
        env:
          SIGNED: ${{ steps.key.outputs.signed }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE_ID: ${{ vars.ANDROID_PACKAGE_ID }}
          EVENT: ${{ github.event_name }}
          NOTES_UK: ${{ inputs.notes_uk }}
          NOTES_EN: ${{ inputs.notes_en }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            track=production
            # Production is released from main only, never from a branch.
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error title=Not main::Release to production from main only (this run is on $GITHUB_REF)."
              exit 1
            fi
          else
            track=alpha
            NOTES_UK='Покращення та виправлення'
            NOTES_EN='Improvements and fixes'
          fi
          # A production run must not end green without a release; a push may, before setup.
          skip() {
            if [ "$track" = production ]; then
              echo "::error title=No Play upload::$1"
              exit 1
            fi
            echo "::warning title=No Play upload::$1"
            echo "Not uploaded to Play: $1" >> "$GITHUB_STEP_SUMMARY"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ "$SIGNED" = true ] || skip "the bundle is unsigned (no upload key secrets)."
          [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] || skip "PLAY_SERVICE_ACCOUNT_JSON is not set. Upload the first .aab by hand in Play Console, then add the service account (docs/android-release.md)."
          if [ -z "$PACKAGE_ID" ]; then
            echo "::error title=No package id::Set the repository variable ANDROID_PACKAGE_ID (app.teachclockforkids)."
            exit 1
          fi
          # Play: one file per locale, named whatsnew-<BCP 47>, at most 500 characters each.
          dir="$RUNNER_TEMP/whatsnew"
          mkdir -p "$dir"
          write_notes() { # locale, text, input name
            if [ -z "${2//[[:space:]]/}" ]; then
              echo "::error title=Empty release notes::$3 is empty."
              exit 1
            fi
            # Count characters, not bytes (Cyrillic is two bytes each in UTF-8).
            length=$(printf '%s' "$2" | LC_ALL=C.UTF-8 wc -m | tr -d ' ')
            if [ "$length" -gt 500 ]; then
              echo "::error title=Release notes too long::$3 has $length characters; Play allows 500."
              exit 1
            fi
            printf '%s' "$2" > "$dir/whatsnew-$1"
          }
          write_notes uk-UA "$NOTES_UK" notes_uk
          write_notes en-US "$NOTES_EN" notes_en
          {
            echo "upload=true"
            echo "track=$track"
            echo "dir=$dir"
          } >> "$GITHUB_OUTPUT"
      - name: Upload to Play
        if: steps.play.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_PACKAGE_ID }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ steps.play.outputs.track }}
          status: completed
          whatsNewDirectory: ${{ steps.play.outputs.dir }}
      - name: Play summary
        if: steps.play.outputs.upload == 'true'
        env:
          TRACK: ${{ steps.play.outputs.track }}
        run: echo "Uploaded versionCode ${VERSION_CODE} to Play track \`$TRACK\`." >> "$GITHUB_STEP_SUMMARY"
