name: Android app bundle

on:
  push:
    branches: [main]
    # Build only when the app changes: docs, .scratch, e2e and other workflows do not.
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*'
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      # Play needs a higher versionCode on every upload (android/app/build.gradle reads it).
      VERSION_CODE: ${{ github.run_number }}
      # The upload key (docs/android-release.md). Secrets cannot be used in `if:`, so they go
      # through env and the "Upload key" step decides whether the bundle is signed.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'
      - uses: gradle/actions/setup-gradle@v6

      # All four secrets: signed. None: unsigned, with a warning (before the wizard has run).
      # Some but not all: fail, since that is a typo in the secrets, not a fresh repo.
      - name: Upload key
        id: key
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -eq 4 ]; then
            echo "::warning title=Unsigned bundle::No upload key secrets are set, so this .aab is unsigned and Play will not accept it. Run the release wizard (docs/android-release.md) to add them."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          elif [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Upload key incomplete::Missing secrets: ${missing[*]}. Set all four or none."
            exit 1
          else
            keystore="$RUNNER_TEMP/upload-key.jks"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
      # VITE_TARGET=android build (with type-check), then cap sync android.
      - run: npm run build:android
      - name: Gradle bundleRelease
        working-directory: android
        run: ./gradlew bundleRelease
      # Fails on location or AD_ID in the merged manifest (Families policy).
      - run: npm run check:android

      - name: Bundle name
        id: name
        env:
          SIGNED: ${{ steps.key.outputs.signed }}
        run: |
          if [ "$SIGNED" = true ]; then
            echo "artifact=teach-clock-${VERSION_CODE}" >> "$GITHUB_OUTPUT"
            echo "Signed \`.aab\`, versionCode ${VERSION_CODE}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "artifact=teach-clock-${VERSION_CODE}-unsigned" >> "$GITHUB_OUTPUT"
            echo "**Unsigned** \`.aab\`, versionCode ${VERSION_CODE}: the upload key secrets are not set, so Play will not accept it." >> "$GITHUB_STEP_SUMMARY"
          fi
      # Kept so the very first upload can be done by hand in Play Console.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-key.jks"

      # Ticket 12: upload to Play goes here (closed testing on push, production on
      # workflow_dispatch), only when steps.key.outputs.signed == 'true' and
      # PLAY_SERVICE_ACCOUNT_JSON is set.
