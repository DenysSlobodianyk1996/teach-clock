name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Deploy only when the app changes: docs, .scratch and other workflows do not.
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*'
      - 'env.d.ts'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  # Reads the Android workflow's run number for the version (the Version step).
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The Privacy Page shows the same version as the Android App built from this commit
      # (scripts/appVersion.ts): VERSION_CODE is the run number of the Android workflow's push run
      # for this commit, which starts with this one. Without one (a change only to this workflow, or
      # Run workflow), the latest Android run's number.
      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=''
          for attempt in 1 2 3 4 5 6; do
            code=$(gh run list -R "$GITHUB_REPOSITORY" --workflow android.yml --event push --commit "$GITHUB_SHA" --json number --jq '.[0].number // empty')
            [ -n "$code" ] && break
            sleep 10
          done
          if [ -z "$code" ]; then
            code=$(gh run list -R "$GITHUB_REPOSITORY" --workflow android.yml --limit 1 --json number --jq '.[0].number // empty')
          fi
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "Privacy Page version from Android run ${code:-none}." >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
        env:
          GITHUB_PAGES: '1'
      # Pages has no SPA fallback: serve the app for deep links like /teach-clock/settings.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
