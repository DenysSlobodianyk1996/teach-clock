<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="48x48" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon-180x180.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <meta name="theme-color" content="__THEME_BG_LIGHT__" />
    <meta name="description" content="__APP_DESCRIPTION__" />
    <title>__APP_NAME__</title>
    <script>
      // Paint the theme before the app loads, by the rule in src/stores/preferences.ts: a saved
      // light or dark, else the device's dark mode. The colours are each theme's --bg, filled in
      // from src/themeColors.ts by vite.config.ts.
      try {
        var colours = { dark: '__THEME_BG_DARK__', light: '__THEME_BG_LIGHT__' }
        var theme = localStorage.getItem('teach-clock.theme')
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').setAttribute('content', colours[theme])
      } catch (e) {}
      // Name and describe the page and set the language before the app loads, by the rule in
      // src/stores/preferences.ts: a saved language on the list, else the device's
      // languages by src/i18n/deviceLocale.ts. vite.config.ts fills in the list (src/i18n/locales.ts),
      // that rule and each language's text.
      try {
        var locales = __LOCALES__
        var text = __APP_TEXT__
        var locale = localStorage.getItem('teach-clock.locale')
        if (locales.indexOf(locale) === -1) {
          locale = __DEVICE_LOCALE__(locales, navigator.languages, navigator.language)
        }
        document.documentElement.lang = locale
        document.title = text[locale].name
        document
          .querySelector('meta[name="description"]')
          .setAttribute('content', text[locale].description)
        // The Web App installs under the Game Name in this language (src/webManifest.ts); the
        // Android App has no manifest. An installed Web App keeps its name (decision 8, batch 13):
        // it links no manifest, so the browser never offers to rename it.
        var manifests = __WEB_MANIFESTS__
        var manifest = document.querySelector('link[rel="manifest"]')
        if (manifest && matchMedia('(display-mode: standalone)').matches) manifest.remove()
        else if (manifest && manifests) manifest.href = manifests[locale]
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
