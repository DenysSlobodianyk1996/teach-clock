<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d4b5c" />
    <meta name="description" content="Гра, яка вчить дітей читати й ставити час на годиннику зі стрілками." />
    <title>Вчимо годинник</title>
    <script>
      // Paint the remembered theme before the app loads. src/stores/preferences.ts owns the key;
      // the colours are each theme's --bg in src/styles/theme.css.
      try {
        var bg = { dark: '#121a24', light: '#f5efe3' }[localStorage.getItem('teach-clock.theme')]
        if (bg) {
          document.documentElement.dataset.theme = localStorage.getItem('teach-clock.theme')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', bg)
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
