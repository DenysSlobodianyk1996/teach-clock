<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teach Clock design</title>
<style>
  :root { --bg: #121a24; --text: #eef2f6; --muted: #b3c0cd; --card: #1c2633; --accent: #f0b444; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 16px; background: rgba(18, 26, 36, 0.95); border-bottom: 1px solid rgba(255,255,255,.1); }
  header h1 { margin: 0; font-size: 18px; }
  header a { color: var(--accent); text-decoration: none; font-weight: 600; }
  header label { margin-left: auto; color: var(--muted); }
  main { padding: 8px 16px 48px; max-width: 2000px; margin: 0 auto; }
  h2 { margin: 32px 0 12px; font-size: 22px; }
  .row { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  figure { margin: 0; display: flex; flex-direction: column; gap: 6px; }
  figcaption { color: var(--muted); font-size: 13px; }
  figcaption a { color: var(--accent); }
  .frame { overflow: hidden; border-radius: 12px; background: var(--card); box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  .frame iframe { border: 0; transform-origin: 0 0; display: block; pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>Teach Clock: design prototype</h1>
  <span style="color: var(--muted)">Local copy of the canvas. Click a caption to open one screen at full size.</span>
  <label>Scale <select id="scale"><option value="0.3">30%</option><option value="0.45" selected>45%</option><option value="0.6">60%</option><option value="1">100%</option></select></label>
</header>
<main id="out"></main>
<script>
  // Same boards and groups as project/canvas.json (kept inline so the page works from file://).
  const groups = [
    ["Стиль і елементи", [["Main", 1024, 768, "Стиль: кольори, годинник, елементи"]]],
    ["Вітання, налаштування і конфіденційність", [["Welcome", 1024, 768, "Вітання"], ["Settings", 1024, 768, "Налаштування (чотири гри, Розстав години, Години 1–12)"], ["LightSettings", 1024, 768, "Світла · Налаштування"], ["SettingsSetTime", 1024, 768, "Налаштування (Який час?, з кроком)"], ["LeaveRound", 1024, 768, "Вийти з раунду?"], ["Privacy", 1024, 768, "Конфіденційність"], ["SettingsHours24", 1024, 768, "Налаштування (Години 13–24)"]]],
    ["Який час? (Set Time)", [["SetTimeTest", 1024, 768, "Перевірка"], ["SetTimeTeachWrong", 1024, 768, "Навчання: помилка"], ["LightSetTime", 1024, 768, "Світла · Навчання"]]],
    ["Постав стрілки (Drag Arrows)", [["DragArrowsTest", 1024, 768, "Перевірка"], ["DragArrowsTeachHelp", 1024, 768, "Навчання"], ["DragArrowsTeachWrong", 1024, 768, "Навчання: помилка"]]],
    ["Розстав години і хвилини (Drag Hours, Drag Minutes)", [["DragHoursDrag", 1024, 768, "Перетягування"], ["DragHoursTeachWrong", 1024, 768, "Навчання: помилка"], ["PhoneDragHoursTeachWrong", 390, 844, "Телефон · Навчання: помилка"], ["DragHoursTestSubmit", 1024, 768, "Перевірка: усі 12"], ["DragMinutesTestSubmit", 1024, 768, "Розстав хвилини · Перевірка: усі 12"]]],
    ["Підсумок (Summary)", [["Summary", 1024, 1100, "Підсумок"], ["LightSummary", 1024, 1100, "Світла · Підсумок"], ["SummaryDragHours", 1024, 768, "Підсумок: Розстав години"], ["SummaryDragMinutes", 1024, 768, "Підсумок: Розстав хвилини"], ["SummaryDragHoursTeach", 1024, 1100, "Підсумок: Розстав години 13–24 · Навчання"]]],
    ["Телефон: до 768 px завширшки або вертикально", [["PhoneWelcome", 360, 640, "Вітання (360 × 640, Footer унизу)"], ["PhoneWelcomeInfo", 360, 640, "Вітання: ⓘ відкрито"], ["PhoneSettings", 360, 640, "Налаштування (360 × 640, Footer унизу)"], ["PhoneSettingsGameInfo", 360, 640, "Налаштування: ⓘ Гра відкрито"], ["PhoneSettingsHours", 360, 640, "Налаштування: Розстав години (Години)"], ["PhoneSettingsSetTime", 360, 640, "Налаштування: Який час? (Крок хвилин)"], ["PhoneSetTime", 360, 640, "Який час?"], ["PhoneDragArrows", 360, 640, "Постав стрілки"], ["PhoneDragHours", 360, 640, "Розстав години"], ["PhoneDragMinutes", 360, 640, "Розстав хвилини: помилка"], ["PhoneSummary", 390, 1700, "Підсумок"], ["PhoneDragHours24", 360, 640, "Розстав години 13–24: помилка"]]],
    ["Комп’ютер: ігрова зона до 1024 px", [["DesktopWelcome", 1440, 900, "Вітання"], ["DesktopSettings", 1440, 900, "Налаштування"], ["DesktopSetTime", 1440, 900, "Який час?"], ["DesktopDragArrows", 1440, 900, "Постав стрілки"], ["DesktopDragHours", 1440, 900, "Розстав години"], ["DesktopDragMinutes", 1440, 900, "Розстав хвилини: помилка"], ["DesktopSummary", 1440, 900, "Підсумок"]]],
  ];

  const out = document.getElementById("out");
  const scaleSelect = document.getElementById("scale");

  function render() {
    const s = parseFloat(scaleSelect.value);
    out.textContent = "";
    for (const [title, boards] of groups) {
      const h2 = document.createElement("h2");
      h2.textContent = title;
      const row = document.createElement("div");
      row.className = "row";
      for (const [file, w, h, label] of boards) {
        const src = "project/" + file + ".dc.html";
        const fig = document.createElement("figure");
        const frame = document.createElement("div");
        frame.className = "frame";
        frame.style.width = Math.round(w * s) + "px";
        frame.style.height = Math.round(h * s) + "px";
        const iframe = document.createElement("iframe");
        iframe.src = src;
        iframe.width = w;
        iframe.height = h;
        iframe.loading = "lazy";
        iframe.title = label;
        iframe.style.transform = "scale(" + s + ")";
        frame.append(iframe);
        const cap = document.createElement("figcaption");
        const a = document.createElement("a");
        a.href = src;
        a.target = "_blank";
        a.textContent = label;
        cap.append(a, " · " + w + "×" + h);
        fig.append(frame, cap);
        row.append(fig);
      }
      out.append(h2, row);
    }
  }

  try { scaleSelect.value = localStorage.getItem("tc-gallery-scale") || scaleSelect.value; } catch (e) {}
  scaleSelect.addEventListener("change", () => {
    try { localStorage.setItem("tc-gallery-scale", scaleSelect.value); } catch (e) {}
    render();
  });
  render();
</script>
</body>
</html>
