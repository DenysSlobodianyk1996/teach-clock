<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Телефон: Налаштування</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#f2b84b}a:hover{color:#ffd27a}
</style>
</helmet>
<!-- Phone Settings on 360 × 640 (Постав стрілки, Крок хвилин): the screen down to Грати, then the Footer below the fold. -->
<div class="tc dark" style="position: relative; width: 360px; height: 701px; display: flex; flex-direction: column">
  <header class="hdr" style="height: 64px; padding: 0 14px">
    <div class="brand"><svg class="c-icon" viewBox="-100 -100 200 200" aria-hidden="true"><circle class="c-face" r="90"></circle><line class="c-hour" y1="8" y2="-42" transform="rotate(300)"></line><line class="c-min" y1="10" y2="-64" transform="rotate(60)"></line><circle class="c-pin" r="9"></circle></svg></div>
    <div class="hdr-tools" style="gap: 8px">
      <div class="seg" role="group" aria-label="Мова"><button type="button" aria-pressed="true">УК</button><button type="button" aria-pressed="false">EN</button></div>
      <button class="theme-toggle" type="button" role="switch" aria-checked="true" aria-label="Темна тема"><span class="tt-knob"></span><span class="tt-icon tt-sun"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"></circle><line x1="12" y1="4.5" x2="12" y2="2"></line><line x1="17.3" y1="6.7" x2="19.07" y2="4.93"></line><line x1="19.5" y1="12" x2="22" y2="12"></line><line x1="17.3" y1="17.3" x2="19.07" y2="19.07"></line><line x1="12" y1="19.5" x2="12" y2="22"></line><line x1="6.7" y1="17.3" x2="4.93" y2="19.07"></line><line x1="4.5" y1="12" x2="2" y2="12"></line><line x1="6.7" y1="6.7" x2="4.93" y2="4.93"></line></svg></span><span class="tt-icon tt-moon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M 11.24 3.04 A 9 9 0 1 0 20.97 12.77 A 7 7 0 0 1 11.24 3.04 Z"></path></svg></span></button><a class="icon-btn" href="PhoneWelcome.dc.html" aria-label="Додому" style="padding: 0; width: 48px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg></a>
    </div>
  </header>

  <!-- Phone: no card shows a description; Гра and Режим each have an ⓘ that opens their Info Popup.
       Compact cards (a 36 px icon beside the title), the greeting at 22 px; Назад and Грати in view on 360 × 640. -->
  <main style="flex: none; height: 576px; display: flex; flex-direction: column; gap: 12px; padding: 4px 20px 24px">
    <h1 style="margin: 0; font-size: 22px; font-weight: 900">Оля, у що граємо?</h1>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div class="label" style="display: flex; align-items: center; gap: 8px">Гра <button class="icon-btn" type="button" aria-label="Докладніше" style="flex: none; width: 44px; min-width: 44px; height: 44px; padding: 0; border: 0; color: var(--muted); margin: -12px 0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="width: 26px; height: 26px"><circle cx="12" cy="12" r="9.5"></circle><path d="M12 11v6"></path><circle cx="12" cy="7.4" r="0.6" fill="currentColor" stroke-width="1.6"></circle></svg></button></div>
      <!-- Two by two: Drag Hours and Drag Minutes share the first row. -->
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button class="choice" type="button" aria-pressed="false" style="flex-direction: row; align-items: center; gap: 10px; min-height: 60px; padding: 8px 10px; border-radius: 18px"><svg class="c-icon" viewBox="-100 -100 200 200" aria-hidden="true" style="width: 36px; height: 36px; flex: none"><circle class="c-face" r="90"></circle><circle class="c-slot" cx="0" cy="-62" r="16"></circle><circle class="c-slot" cx="62" cy="0" r="16"></circle><circle class="c-slot" cx="0" cy="62" r="16"></circle><circle class="c-tile" cx="-62" cy="0" r="18"></circle><text class="c-tile-num" x="-62" y="0">9</text></svg><b style="font-size: 17px; line-height: 1.15">Розстав години</b></button>
      <button class="choice" type="button" aria-pressed="false" style="flex-direction: row; align-items: center; gap: 10px; min-height: 60px; padding: 8px 10px; border-radius: 18px"><svg class="c-icon" viewBox="-100 -100 200 200" aria-hidden="true" style="width: 36px; height: 36px; flex: none"><circle class="c-face" r="90"></circle><circle class="c-slot" cx="-60" cy="-8" r="16"></circle><circle class="c-tile" cx="28" cy="-48" r="32"></circle><text class="c-tile-num" x="28" y="-48" style="font-size: 36px">5</text><circle class="c-tile" cx="0" cy="56" r="32"></circle><text class="c-tile-num" x="0" y="56" style="font-size: 36px">30</text></svg><b style="font-size: 17px; line-height: 1.15">Розстав хвилини</b></button>
      <button class="choice" type="button" aria-pressed="true" style="flex-direction: row; align-items: center; gap: 10px; min-height: 60px; padding: 8px 10px; border-radius: 18px"><svg class="c-icon" viewBox="-100 -100 200 200" aria-hidden="true" style="width: 36px; height: 36px; flex: none"><circle class="c-face" r="90"></circle><line class="c-hour" y1="8" y2="-42" transform="rotate(120)"></line><line class="c-min" y1="10" y2="-64"></line><circle class="c-grip m" cx="0" cy="-64" r="14"></circle><circle class="c-pin" r="9"></circle></svg><b style="font-size: 17px; line-height: 1.15">Постав стрілки</b></button>
      <button class="choice" type="button" aria-pressed="false" style="flex-direction: row; align-items: center; gap: 10px; min-height: 60px; padding: 8px 10px; border-radius: 18px"><svg class="c-icon" viewBox="-100 -100 200 200" aria-hidden="true" style="width: 36px; height: 36px; flex: none"><circle class="c-face" r="90"></circle><text class="c-num" x="0" y="2" style="font-size: 54px">4:15</text></svg><b style="font-size: 17px; line-height: 1.15">Який час?</b></button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div class="label" style="display: flex; align-items: center; gap: 8px">Режим <button class="icon-btn" type="button" aria-label="Докладніше" style="flex: none; width: 44px; min-width: 44px; height: 44px; padding: 0; border: 0; color: var(--muted); margin: -12px 0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="width: 26px; height: 26px"><circle cx="12" cy="12" r="9.5"></circle><path d="M12 11v6"></path><circle cx="12" cy="7.4" r="0.6" fill="currentColor" stroke-width="1.6"></circle></svg></button></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button class="choice" type="button" aria-pressed="true" style="flex-direction: row; align-items: center; gap: 10px; min-height: 60px; padding: 8px 10px; border-radius: 18px"><svg class="mode-icon teach" viewBox="-100 -100 200 200" aria-hidden="true" style="width: 36px; height: 36px; flex: none"><g class="m-rays"><line x1="0" y1="-78" x2="0" y2="-96"></line><line x1="-42" y1="-60" x2="-55" y2="-73"></line><line x1="42" y1="-60" x2="55" y2="-73"></line><line x1="-60" y1="-18" x2="-78" y2="-18"></line><line x1="60" y1="-18" x2="78" y2="-18"></line></g><path class="m-bulb" d="M -28 18 A 46 46 0 1 1 28 18 L 22 40 L -22 40 Z"></path><path class="m-filament" d="M -11 30 L -11 6 L 0 -6 L 11 6 L 11 30"></path><rect class="m-base" x="-24" y="48" width="48" height="12" rx="6"></rect><rect class="m-base" x="-16" y="66" width="32" height="12" rx="6"></rect></svg><b style="font-size: 17px; line-height: 1.15">Навчання</b></button>
      <button class="choice" type="button" aria-pressed="false" style="flex-direction: row; align-items: center; gap: 10px; min-height: 60px; padding: 8px 10px; border-radius: 18px"><svg class="mode-icon test" viewBox="-100 -100 200 200" aria-hidden="true" style="width: 36px; height: 36px; flex: none"><circle class="m-badge" r="78"></circle><path class="m-check" d="M -38 2 L -12 28 L 40 -26"></path></svg><b style="font-size: 17px; line-height: 1.15">Перевірка</b></button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div class="label">Крок хвилин</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px"><button class="choice" type="button" aria-pressed="true" style="align-items: center; justify-content: center; padding: 8px 6px; text-align: center"><b>1 хв</b></button><button class="choice" type="button" aria-pressed="false" style="align-items: center; justify-content: center; padding: 8px 6px; text-align: center"><b>5 хв</b></button><button class="choice" type="button" aria-pressed="false" style="align-items: center; justify-content: center; padding: 8px 6px; text-align: center"><b>15 хв</b></button></div>
    </div>

    <div style="flex-grow: 1"></div>
    <div style="display: flex; gap: 10px">
      <a class="btn btn-soft" href="PhoneWelcome.dc.html" style="flex: 1 1 0; padding: 0 12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Назад</a>
      <a class="btn" href="PhoneDragArrows.dc.html" style="flex: 1 1 0; padding: 0 12px">Грати<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l11 7-11 7z"></path></svg></a>
    </div>
  </main>
  <footer class="ftr" role="contentinfo"><nav class="ftr-links"><a href="Privacy.dc.html">Конфіденційність</a><a href="mailto:denys.slobodianyk@gmail.com?subject=Contact%20support%20from%20teach%20clock%20for%20kids">Зв’язатися</a></nav></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":701}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
