<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Телефон: Налаштування</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#f2b84b}a:hover{color:#ffd27a}
</style>
</helmet>
<div class="tc" style="width: 390px; height: 844px; display: flex; flex-direction: column">
  <header class="hdr" style="height: 64px; padding: 0 14px">
    <div class="brand"><svg viewBox="-100 -100 200 200" aria-hidden="true"><circle class="c-face" r="90"></circle><line class="c-hour" y1="8" y2="-42" transform="rotate(300)"></line><line class="c-min" y1="10" y2="-64" transform="rotate(60)"></line><circle class="c-pin" r="9"></circle></svg></div>
    <div class="hdr-tools" style="gap: 8px">
      <div class="seg" role="group" aria-label="Мова"><button type="button" aria-pressed="true">УК</button><button type="button" aria-pressed="false">EN</button></div>
      <button class="icon-btn" type="button" aria-label="Тема: середня. Змінити" style="padding: 0; width: 48px"><span class="swatch sw-middle" style="width: 26px; height: 26px"></span></button>
      <a class="icon-btn" href="PhoneWelcome.dc.html" aria-label="Додому" style="padding: 0; width: 48px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg></a>
    </div>
  </header>

  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px; padding: 4px 16px 20px">
    <h1 style="margin: 0 0 4px; font-size: 26px; font-weight: 900">Оля, у що граємо?</h1>

    <div class="label">Гра</div>
    <button class="choice" type="button" aria-pressed="false" style="flex-direction: row; align-items: center; gap: 12px; padding: 10px 14px">
      <svg viewBox="-100 -100 200 200" aria-hidden="true" style="width: 44px; height: 44px; flex: none"><circle class="c-face" r="90"></circle><circle class="c-slot" cx="0" cy="-62" r="16"></circle><circle class="c-slot" cx="62" cy="0" r="16"></circle><circle class="c-slot" cx="0" cy="62" r="16"></circle><circle class="c-tile" cx="-62" cy="0" r="18"></circle><text class="c-tile-num" x="-62" y="0">9</text></svg>
      <div style="display: flex; flex-direction: column; gap: 2px"><b>Розстав числа</b><span>Перетягни числа 1–12 на їхні місця.</span></div>
    </button>
    <button class="choice" type="button" aria-pressed="true" style="flex-direction: row; align-items: center; gap: 12px; padding: 10px 14px">
      <svg viewBox="-100 -100 200 200" aria-hidden="true" style="width: 44px; height: 44px; flex: none"><circle class="c-face" r="90"></circle><line class="c-hour" y1="8" y2="-42" transform="rotate(120)"></line><line class="c-min" y1="10" y2="-64"></line><circle class="c-grip m" cx="0" cy="-64" r="14"></circle><circle class="c-pin" r="9"></circle></svg>
      <div style="display: flex; flex-direction: column; gap: 2px"><b>Постав стрілки</b><span>Покажи на годиннику заданий час.</span></div>
    </button>
    <button class="choice" type="button" aria-pressed="false" style="flex-direction: row; align-items: center; gap: 12px; padding: 10px 14px">
      <svg viewBox="-100 -100 200 200" aria-hidden="true" style="width: 44px; height: 44px; flex: none"><circle class="c-face" r="90"></circle><text class="c-num" x="0" y="2" style="font-size: 54px">4:15</text></svg>
      <div style="display: flex; flex-direction: column; gap: 2px"><b>Який час?</b><span>Подивись на годинник і введи час.</span></div>
    </button>

    <div class="label" style="margin-top: 6px">Режим</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button class="choice" type="button" aria-pressed="true" style="padding: 10px 14px"><b>Навчання</b><span>З підказками.</span></button>
      <button class="choice" type="button" aria-pressed="false" style="padding: 10px 14px"><b>Перевірка</b><span>Без підказок.</span></button>
    </div>

    <div class="label" style="margin-top: 6px">Крок хвилин</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button class="choice" type="button" aria-pressed="true" style="padding: 10px 6px; align-items: center"><b>1</b><span>хв</span></button>
      <button class="choice" type="button" aria-pressed="false" style="padding: 10px 6px; align-items: center"><b>5</b><span>хв</span></button>
      <button class="choice" type="button" aria-pressed="false" style="padding: 10px 6px; align-items: center"><b>15</b><span>хв</span></button>
    </div>
    <div style="font-size: 14px; color: var(--muted)">1 хв: будь-яка хвилина.</div>

    <div style="flex-grow: 1"></div>
    <div style="display: flex; gap: 10px">
      <a class="btn btn-soft" href="PhoneWelcome.dc.html" aria-label="Назад" style="padding: 0; width: 60px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <a class="btn" href="PhoneDragArrows.dc.html" style="flex-grow: 1">Грати<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l11 7-11 7z"></path></svg></a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
