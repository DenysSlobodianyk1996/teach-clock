<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Покинути раунд?</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#f2b84b}a:hover{color:#ffd27a}
</style>
</helmet>
<div class="tc" style="width: 1024px; height: 768px; display: flex; flex-direction: column">
  <header class="hdr">
    <div class="brand"><svg viewBox="-100 -100 200 200" aria-hidden="true"><circle class="c-face" r="90"></circle><line class="c-hour" y1="8" y2="-42" transform="rotate(300)"></line><line class="c-min" y1="10" y2="-64" transform="rotate(60)"></line><circle class="c-pin" r="9"></circle></svg>Вчимо годинник</div>
    <div class="hdr-tools">
      <div class="seg" role="group" aria-label="Мова"><button type="button" aria-pressed="true">УК</button><button type="button" aria-pressed="false">EN</button></div>
      <div class="seg" role="group" aria-label="Тема"><button type="button" aria-pressed="true" aria-label="Середня тема"><span class="swatch sw-middle"></span></button><button type="button" aria-pressed="false" aria-label="Темна тема"><span class="swatch sw-dark"></span></button><button type="button" aria-pressed="false" aria-label="Світла тема"><span class="swatch sw-light"></span></button></div>
      <button class="icon-btn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h5v16h-5"></path><path d="M9 8l-4 4 4 4"></path><path d="M5 12h11"></path></svg>Вийти</button>
    </div>
  </header>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 6px">
    <div class="dots" aria-label="Прогрес: завдання 4 з 10">
      <span class="dot ok"></span><span class="dot bad"></span><span class="dot ok"></span><span class="dot now"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div class="task-no">Завдання 4 з 10 · Перевірка</div>
  </div>

  <main style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: center; padding: 0 48px 28px">
    <div style="display: flex; justify-content: center">
      <svg class="clock" viewBox="-100 -100 200 200" role="img" aria-label="Годинник показує 7:45" style="width: 420px; height: 420px">
        <circle class="c-face" r="94"></circle>
        <circle class="c-tick" r="84" stroke-dasharray="1.2 7.5965" stroke-dashoffset="0.6"></circle>
        <circle class="c-tick5" r="84" stroke-dasharray="3 40.982" stroke-dashoffset="1.5"></circle>
        <text class="c-num" x="33" y="-57.2">1</text><text class="c-num" x="57.2" y="-33">2</text><text class="c-num" x="66" y="0">3</text><text class="c-num" x="57.2" y="33">4</text><text class="c-num" x="33" y="57.2">5</text><text class="c-num" x="0" y="66">6</text><text class="c-num" x="-33" y="57.2">7</text><text class="c-num" x="-57.2" y="33">8</text><text class="c-num" x="-66" y="0">9</text><text class="c-num" x="-57.2" y="-33">10</text><text class="c-num" x="-33" y="-57.2">11</text><text class="c-num" x="0" y="-66">12</text>
        <line class="c-hour" y1="10" y2="-45" transform="rotate(232.5)"></line>
        <line class="c-min" y1="14" y2="-70" transform="rotate(270)"></line>
        <circle class="c-pin" r="7"></circle>
      </svg>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 18px">
      <h1 style="margin: 0; font-size: 32px; font-weight: 900">Котра година?</h1>
      <div class="timebox-row">
        <div class="timebox h" aria-label="Години">7</div>
        <span class="colon">:</span>
        <div class="timebox mm empty" aria-label="Хвилини">––</div>
        <span class="range h">1–12</span>
        <span class="range mm">0–59</span>
      </div>
    </div>
  </main>

  <div class="scrim">
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="leave-title" style="width: 460px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: 48px; height: 48px; color: var(--hour)"><path d="M14 4h5v16h-5"></path><path d="M9 8l-4 4 4 4"></path><path d="M5 12h11"></path></svg>
      <h2 id="leave-title">Покинути раунд?</h2>
      <p>Цей раунд не збережеться. Ти повернешся до вибору гри.</p>
      <div style="display: flex; gap: 14px">
        <button class="btn" type="button">Грати далі</button>
        <a class="btn btn-soft" href="Settings.dc.html" style="background: var(--bg-deep); color: var(--text)">Вийти</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
