<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Телефон: Вітання</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#f2b84b}a:hover{color:#ffd27a}
</style>
</helmet>
<div class="tc" style="width: 390px; height: 844px; display: flex; flex-direction: column">
  <header class="hdr" style="height: 64px; padding: 0 14px">
    <div class="brand"><svg viewBox="-100 -100 200 200" aria-hidden="true"><circle class="c-face" r="90"></circle><line class="c-hour" y1="8" y2="-42" transform="rotate(300)"></line><line class="c-min" y1="10" y2="-64" transform="rotate(60)"></line><circle class="c-pin" r="9"></circle></svg><span style="font-size: 18px">Вчимо годинник</span></div>
    <div class="hdr-tools" style="gap: 8px">
      <div class="seg" role="group" aria-label="Мова"><button type="button" aria-pressed="true">УК</button><button type="button" aria-pressed="false">EN</button></div>
      <button class="icon-btn" type="button" aria-label="Тема: середня. Змінити" style="padding: 0; width: 48px"><span class="swatch sw-middle" style="width: 26px; height: 26px"></span></button>
    </div>
  </header>

  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 8px 20px 28px">
    <div style="display: flex; justify-content: center">
      <svg class="clock" viewBox="-100 -100 200 200" role="img" aria-label="Годинник показує 10:10" style="width: 230px; height: 230px">
        <circle class="c-face" r="94"></circle>
        <circle class="c-tick" r="84" stroke-dasharray="1.2 7.5965" stroke-dashoffset="0.6"></circle>
        <circle class="c-tick5" r="84" stroke-dasharray="3 40.982" stroke-dashoffset="1.5"></circle>
        <text class="c-num" x="33" y="-57.2">1</text><text class="c-num" x="57.2" y="-33">2</text><text class="c-num" x="66" y="0">3</text><text class="c-num" x="57.2" y="33">4</text><text class="c-num" x="33" y="57.2">5</text><text class="c-num" x="0" y="66">6</text><text class="c-num" x="-33" y="57.2">7</text><text class="c-num" x="-57.2" y="33">8</text><text class="c-num" x="-66" y="0">9</text><text class="c-num" x="-57.2" y="-33">10</text><text class="c-num" x="-33" y="-57.2">11</text><text class="c-num" x="0" y="-66">12</text>
        <line class="c-hour" y1="10" y2="-45" transform="rotate(305)"></line>
        <line class="c-min" y1="14" y2="-70" transform="rotate(60)"></line>
        <circle class="c-pin" r="7"></circle>
      </svg>
    </div>
    <h1 style="margin: 0; font-size: 32px; font-weight: 900; line-height: 1.1">Привіт! Навчимося читати годинник</h1>
    <p style="margin: 0; font-size: 17px; line-height: 1.45; color: var(--muted)">Три короткі ігри: розстав числа на циферблаті, постав стрілки на потрібний час і прочитай, котру годину показує годинник. Без реєстрації — просто грай.</p>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label class="label" for="name-p">Як тебе звати?</label>
      <input class="field" id="name-p" type="text" value="Оля" placeholder="Твоє ім’я">
    </div>
    <div style="flex-grow: 1"></div>
    <a class="btn" href="PhoneSettings.dc.html" style="width: 100%">Почати<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
