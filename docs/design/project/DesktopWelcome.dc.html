<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Комп’ютер: Вітання</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#f2b84b}a:hover{color:#ffd27a}
</style>
</helmet>
<div class="tc" style="width: 1440px; height: 900px; background: var(--bg-deep)">
  <header class="hdr" style="padding: 0 40px">
    <div class="brand"><svg class="c-icon" viewBox="-100 -100 200 200" aria-hidden="true"><circle class="c-face" r="90"></circle><line class="c-hour" y1="8" y2="-42" transform="rotate(300)"></line><line class="c-min" y1="10" y2="-64" transform="rotate(60)"></line><circle class="c-pin" r="9"></circle></svg>Вчимо годинник</div>
    <div class="hdr-tools">
      <div class="seg" role="group" aria-label="Мова"><button type="button" aria-pressed="true">УК</button><button type="button" aria-pressed="false">EN</button></div>
      <button class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Темна тема"><span class="tt-knob"></span><span class="tt-icon tt-sun"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"></circle><line x1="12" y1="4.5" x2="12" y2="2"></line><line x1="17.3" y1="6.7" x2="19.07" y2="4.93"></line><line x1="19.5" y1="12" x2="22" y2="12"></line><line x1="17.3" y1="17.3" x2="19.07" y2="19.07"></line><line x1="12" y1="19.5" x2="12" y2="22"></line><line x1="6.7" y1="17.3" x2="4.93" y2="19.07"></line><line x1="4.5" y1="12" x2="2" y2="12"></line><line x1="6.7" y1="6.7" x2="4.93" y2="4.93"></line></svg></span><span class="tt-icon tt-moon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M 11.24 3.04 A 9 9 0 1 0 20.97 12.77 A 7 7 0 0 1 11.24 3.04 Z"></path></svg></span></button>
    </div>
  </header>
  <div class="stage-wrap">
    <div class="stage" style="background: var(--bg); display: flex; flex-direction: column">
      <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; align-items: center; padding: 0 64px">
      <div style="display: flex; flex-direction: column; gap: 22px">
        <h1 style="margin: 0; font-size: 50px; font-weight: 900; line-height: 1.08">Привіт! Навчимося читати годинник</h1>
        <p style="margin: 0; font-size: 20px; line-height: 1.45; color: var(--muted)">Чотири короткі гри: розстав на циферблаті години, потім хвилини, постав стрілки на потрібний час і прочитай, котру годину показує годинник. Без реєстрації — просто грай.</p>
        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 6px">
          <label class="label" for="name-d">Як тебе звати?</label>
          <input class="field" id="name-d" type="text" value="" placeholder="Твоє ім’я">
        </div>
        <div><a class="btn" href="DesktopSettings.dc.html">Почати<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a></div>
      </div>
      <div style="display: flex; justify-content: center">
        <svg class="clock" viewBox="-100 -100 200 200" role="img" aria-label="Годинник показує 10:10" style="width: 400px; height: 400px">
          <circle class="c-face" r="94"></circle>
          <circle class="c-tick" r="84" stroke-dasharray="1.2 7.5965" stroke-dashoffset="0.6"></circle>
          <circle class="c-tick5" r="84" stroke-dasharray="3 40.982" stroke-dashoffset="1.5"></circle>
          <text class="c-num" x="33" y="-57.2">1</text><text class="c-num" x="57.2" y="-33">2</text><text class="c-num" x="66" y="0">3</text><text class="c-num" x="57.2" y="33">4</text><text class="c-num" x="33" y="57.2">5</text><text class="c-num" x="0" y="66">6</text><text class="c-num" x="-33" y="57.2">7</text><text class="c-num" x="-57.2" y="33">8</text><text class="c-num" x="-66" y="0">9</text><text class="c-num" x="-57.2" y="-33">10</text><text class="c-num" x="-33" y="-57.2">11</text><text class="c-num" x="0" y="-66">12</text>
          <line class="c-hour" y1="10" y2="-45" transform="rotate(305)"></line>
          <line class="c-min" y1="14" y2="-70" transform="rotate(60)"></line>
          <circle class="c-pin" r="7"></circle>
        </svg>
      </div>
    </div>
      <footer class="ftr" role="contentinfo"><nav class="ftr-links"><a href="Privacy.dc.html">Конфіденційність</a><a href="mailto:denys.slobodianyk@gmail.com?subject=Contact%20support%20from%20teach%20clock%20for%20kids">Зв’язатися</a></nav></footer>
    </div>
  </div>
</div>
</x-dc>

</html>
