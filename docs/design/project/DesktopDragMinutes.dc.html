<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Комп’ютер: Розстав хвилини · Навчання: помилка</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#f2b84b}a:hover{color:#ffd27a}
</style>
</helmet>
<div class="tc" style="width: 1440px; height: 900px; background: var(--bg-deep)">
  <header class="hdr" style="padding: 0 40px">
    <div class="brand"><svg class="c-icon" viewBox="-100 -100 200 200" aria-hidden="true"><circle class="c-face" r="90"></circle><line class="c-hour" y1="8" y2="-42" transform="rotate(300)"></line><line class="c-min" y1="10" y2="-64" transform="rotate(60)"></line><circle class="c-pin" r="9"></circle></svg>Вчимо годинник</div>
    <div class="hdr-tools">
      <div class="seg" role="group" aria-label="Мова"><button type="button" aria-pressed="true">УК</button><button type="button" aria-pressed="false">EN</button></div>
      <div class="seg" role="group" aria-label="Тема"><button type="button" aria-pressed="true" aria-label="Середня тема"><span class="swatch sw-middle"></span></button><button type="button" aria-pressed="false" aria-label="Темна тема"><span class="swatch sw-dark"></span></button><button type="button" aria-pressed="false" aria-label="Світла тема"><span class="swatch sw-light"></span></button></div>
      <a class="icon-btn" href="LeaveRound.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h5v16h-5"></path><path d="M9 8l-4 4 4 4"></path><path d="M5 12h11"></path></svg>Вийти</a>
    </div>
  </header>
  <div class="stage-wrap">
    <div class="stage" style="background: var(--bg); display: flex; flex-direction: column; padding: 24px 48px 32px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 6px">
        <div class="dots" aria-label="Прогрес: на місці 6 з 12 чисел">
          <span class="dot ok"></span><span class="dot ok"></span><span class="dot help"></span><span class="dot ok"></span><span class="dot ok"></span><span class="dot ok"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
        <div class="task-no">На місці 6 з 12 · <svg class="mode-icon teach" viewBox="-100 -100 200 200" aria-hidden="true"><g class="m-rays"><line x1="0" y1="-78" x2="0" y2="-96"></line><line x1="-42" y1="-60" x2="-55" y2="-73"></line><line x1="42" y1="-60" x2="55" y2="-73"></line><line x1="-60" y1="-18" x2="-78" y2="-18"></line><line x1="60" y1="-18" x2="78" y2="-18"></line></g><path class="m-bulb" d="M -28 18 A 46 46 0 1 1 28 18 L 22 40 L -22 40 Z"></path><path class="m-filament" d="M -11 30 L -11 6 L 0 -6 L 11 6 L 11 30"></path><rect class="m-base" x="-24" y="48" width="48" height="12" rx="6"></rect><rect class="m-base" x="-16" y="66" width="32" height="12" rx="6"></rect></svg>Навчання</div>
      </div>

      <main style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: center">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
          <svg class="clock" viewBox="-110 -110 220 220" role="img" aria-label="Циферблат, на місці 6 з 12 чисел" style="width: 440px; height: 440px">
            <circle class="c-face" r="94"></circle>
            <circle class="c-tick5" r="84" stroke-dasharray="3 40.982" stroke-dashoffset="1.5"></circle>
            <g class="hour-badges" aria-hidden="true"><circle class="c-badge" cx="20" cy="-34.6" r="8.5"></circle><text class="c-badge-num" x="20" y="-34.6">1</text><circle class="c-badge" cx="34.6" cy="-20" r="8.5"></circle><text class="c-badge-num" x="34.6" y="-20">2</text><circle class="c-badge" cx="40" cy="0" r="8.5"></circle><text class="c-badge-num" x="40" y="0">3</text><circle class="c-badge" cx="34.6" cy="20" r="8.5"></circle><text class="c-badge-num" x="34.6" y="20">4</text><circle class="c-badge" cx="20" cy="34.6" r="8.5"></circle><text class="c-badge-num" x="20" y="34.6">5</text><circle class="c-badge" cx="0" cy="40" r="8.5"></circle><text class="c-badge-num" x="0" y="40">6</text><circle class="c-badge" cx="-20" cy="34.6" r="8.5"></circle><text class="c-badge-num" x="-20" y="34.6">7</text><circle class="c-badge" cx="-34.6" cy="20" r="8.5"></circle><text class="c-badge-num" x="-34.6" y="20">8</text><circle class="c-badge" cx="-40" cy="0" r="8.5"></circle><text class="c-badge-num" x="-40" y="0">9</text><circle class="c-badge" cx="-34.6" cy="-20" r="8.5"></circle><text class="c-badge-num" x="-34.6" y="-20">10</text><circle class="c-badge" cx="-20" cy="-34.6" r="8.5"></circle><text class="c-badge-num" x="-20" y="-34.6">11</text><circle class="c-badge" cx="0" cy="-40" r="8.5"></circle><text class="c-badge-num" x="0" y="-40">12</text></g>
            <circle class="c-slot" cx="57.2" cy="33" r="14"></circle><circle class="c-slot" cx="-33" cy="57.2" r="14"></circle><circle class="c-slot" cx="-57.2" cy="33" r="14"></circle><circle class="c-slot" cx="-57.2" cy="-33" r="14"></circle><circle class="c-slot" cx="-33" cy="-57.2" r="14"></circle>
            <circle class="c-slot" cx="33" cy="57.2" r="14"></circle>
            <circle class="c-tile" cx="0" cy="-66" r="15"></circle><text class="c-tile-num" x="0" y="-66">60</text>
            <circle class="c-tile" cx="33" cy="-57.2" r="15"></circle><text class="c-tile-num" x="33" y="-57.2">5</text>
            <circle class="c-tile" cx="57.2" cy="-33" r="15"></circle><text class="c-tile-num" x="57.2" y="-33">10</text>
            <circle class="c-tile" cx="66" cy="0" r="15"></circle><text class="c-tile-num" x="66" y="0">15</text>
            <circle class="c-tile" cx="0" cy="66" r="15"></circle><text class="c-tile-num" x="0" y="66">30</text>
            <circle class="c-tile" cx="-66" cy="0" r="15"></circle><text class="c-tile-num" x="-66" y="0">45</text>
            <circle class="c-pin" r="7"></circle>
          </svg>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 18px">
          <h1 style="margin: 0; font-size: 32px; font-weight: 900">Розстав числа по місцях</h1>
          <div class="tray" style="--number-size: 54.5px; grid-template-columns: repeat(4, max-content)" aria-label="Числа">
            <button class="tile" type="button" style="outline: 4px solid var(--hour); outline-offset: 3px">35</button><button class="tile" type="button">55</button><button class="tile" type="button">20</button>
            <button class="tile" type="button">50</button><button class="tile" type="button">40</button><button class="tile" type="button">25</button>
          </div>
          <p style="margin: 0; font-size: 17px; color: var(--muted); text-align: center; max-width: 340px">Перетягни число на його місце або торкнись числа, а потім місця.</p>
        </div>
      </main>
    </div>
  </div>
  <!-- Teach, a wrong drop: the popup lights the number's own slot in green, between its two
       neighbours. Got it closes it (the number stays on the tray, ringed); Set correct answer puts
       it on its slot with a green flash. Nothing is added around the face, so it never moves. -->
  <div class="scrim">
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="wrong-title" style="width: 600px">
      <h2 id="wrong-title">Майже! Правильно так:</h2>
      <svg class="clock" viewBox="-110 -110 220 220" role="img" aria-label="35 стоїть між 30 і 40" style="width: 180px; height: 180px">
          <circle class="c-face" r="94"></circle>
          <circle class="c-tick5" r="84" stroke-dasharray="3 40.982" stroke-dashoffset="1.5"></circle>
          <g class="hour-badges" aria-hidden="true"><circle class="c-badge" cx="20" cy="-34.7" r="10"></circle><text class="c-badge-num" x="20" y="-34.7">1</text><circle class="c-badge" cx="34.7" cy="-20" r="10"></circle><text class="c-badge-num" x="34.7" y="-20">2</text><circle class="c-badge" cx="40" cy="0" r="10"></circle><text class="c-badge-num" x="40" y="0">3</text><circle class="c-badge" cx="34.7" cy="20" r="10"></circle><text class="c-badge-num" x="34.7" y="20">4</text><circle class="c-badge" cx="20" cy="34.7" r="10"></circle><text class="c-badge-num" x="20" y="34.7">5</text><circle class="c-badge" cx="0" cy="40" r="10"></circle><text class="c-badge-num" x="0" y="40">6</text><circle class="c-badge" cx="-20" cy="34.7" r="10"></circle><text class="c-badge-num" x="-20" y="34.7">7</text><circle class="c-badge" cx="-34.7" cy="20" r="10"></circle><text class="c-badge-num" x="-34.7" y="20">8</text><circle class="c-badge" cx="-40" cy="0" r="10"></circle><text class="c-badge-num" x="-40" y="0">9</text><circle class="c-badge" cx="-34.7" cy="-20" r="10"></circle><text class="c-badge-num" x="-34.7" y="-20">10</text><circle class="c-badge" cx="-20" cy="-34.7" r="10"></circle><text class="c-badge-num" x="-20" y="-34.7">11</text><circle class="c-badge" cx="0" cy="-40" r="10"></circle><text class="c-badge-num" x="0" y="-40">12</text></g>
          <circle class="c-slot" cx="33" cy="-57.2" r="14"></circle>
          <circle class="c-slot" cx="57.2" cy="-33" r="14"></circle>
          <circle class="c-slot" cx="66" cy="0" r="14"></circle>
          <circle class="c-slot" cx="57.2" cy="33" r="14"></circle>
          <circle class="c-slot" cx="33" cy="57.2" r="14"></circle>
          <circle class="c-tile" cx="0" cy="66" r="15"></circle><text class="c-tile-num" x="0" y="66">30</text>
          <circle class="c-tile" cx="-33" cy="57.2" r="15" style="fill: var(--good)"></circle><text class="c-tile-num" x="-33" y="57.2">35</text>
          <circle class="c-tile" cx="-57.2" cy="33" r="15"></circle><text class="c-tile-num" x="-57.2" y="33">40</text>
          <circle class="c-slot" cx="-66" cy="0" r="14"></circle>
          <circle class="c-slot" cx="-57.2" cy="-33" r="14"></circle>
          <circle class="c-slot" cx="-33" cy="-57.2" r="14"></circle>
          <circle class="c-slot" cx="0" cy="-66" r="14"></circle>
          <circle class="c-pin" r="7"></circle>
      </svg>
      <p>35 стоїть між 30 і 40</p>
      <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; width: 100%">
        <button class="btn" type="button" style="flex: 1 1 auto; padding: 0 22px; font-size: 19px; background: var(--bg-deep); color: var(--text)">Постав правильну відповідь</button>
        <button class="btn" type="button" style="flex: 1 1 auto; padding: 0 22px; font-size: 19px">Зрозуміло</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
