<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Який час? Навчання: підказка</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#f2b84b}a:hover{color:#ffd27a}
</style>
</helmet>
<div class="tc" style="width: 1024px; height: 768px; display: flex; flex-direction: column">
  <header class="hdr">
    <div class="brand"><svg viewBox="-100 -100 200 200" aria-hidden="true"><circle class="c-face" r="90"></circle><line class="c-hour" y1="8" y2="-42" transform="rotate(300)"></line><line class="c-min" y1="10" y2="-64" transform="rotate(60)"></line><circle class="c-pin" r="9"></circle></svg>Вчимо годинник</div>
    <div class="hdr-tools">
      <div class="seg" role="group" aria-label="Мова"><button type="button" aria-pressed="true">УК</button><button type="button" aria-pressed="false">EN</button></div>
      <div class="seg" role="group" aria-label="Тема"><button type="button" aria-pressed="true" aria-label="Середня тема"><span class="swatch sw-middle"></span></button><button type="button" aria-pressed="false" aria-label="Темна тема"><span class="swatch sw-dark"></span></button><button type="button" aria-pressed="false" aria-label="Світла тема"><span class="swatch sw-light"></span></button></div>
      <a class="icon-btn" href="LeaveRound.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h5v16h-5"></path><path d="M9 8l-4 4 4 4"></path><path d="M5 12h11"></path></svg>Вийти</a>
    </div>
  </header>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 6px">
    <div class="dots" aria-label="Прогрес: завдання 4 з 10">
      <span class="dot ok"></span><span class="dot help"></span><span class="dot ok"></span><span class="dot now"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div class="task-no">Завдання 4 з 10 · <svg class="mode-icon teach" viewBox="-100 -100 200 200" aria-hidden="true"><g class="m-rays"><line x1="0" y1="-78" x2="0" y2="-96"></line><line x1="-42" y1="-60" x2="-55" y2="-73"></line><line x1="42" y1="-60" x2="55" y2="-73"></line><line x1="-60" y1="-18" x2="-78" y2="-18"></line><line x1="60" y1="-18" x2="78" y2="-18"></line></g><path class="m-bulb" d="M -28 18 A 46 46 0 1 1 28 18 L 22 40 L -22 40 Z"></path><path class="m-filament" d="M -11 30 L -11 6 L 0 -6 L 11 6 L 11 30"></path><rect class="m-base" x="-24" y="48" width="48" height="12" rx="6"></rect><rect class="m-base" x="-16" y="66" width="32" height="12" rx="6"></rect></svg>Навчання</div>
  </div>

  <main style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: center; padding: 0 48px 28px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 16px">
      <svg class="clock" viewBox="-100 -100 200 200" role="img" aria-label="Годинник показує 7:45" style="width: 420px; height: 420px">
        <circle class="c-face" r="94"></circle>
        <circle class="c-tick" r="84" stroke-dasharray="1.2 7.5965" stroke-dashoffset="0.6"></circle>
        <circle class="c-tick5" r="84" stroke-dasharray="3 40.982" stroke-dashoffset="1.5"></circle>
        <text class="c-num" x="33" y="-57.2">1</text><text class="c-num" x="57.2" y="-33">2</text><text class="c-num" x="66" y="0">3</text><text class="c-num" x="57.2" y="33">4</text><text class="c-num" x="33" y="57.2">5</text><text class="c-num" x="0" y="66">6</text><text class="c-num" x="-33" y="57.2">7</text><text class="c-num" x="-57.2" y="33">8</text><text class="c-num" x="-66" y="0">9</text><text class="c-num" x="-57.2" y="-33">10</text><text class="c-num" x="-33" y="-57.2">11</text><text class="c-num" x="0" y="-66">12</text>
        <line class="c-hour" y1="10" y2="-45" transform="rotate(232.5)"></line>
        <line class="c-min" y1="14" y2="-70" transform="rotate(270)"></line>
        <circle class="c-pin" r="7"></circle>
      </svg>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px"><button class="btn btn-help" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"></path></svg>Постав правильну відповідь</button><div style="font-size: 18px; color: var(--muted)">Підказка: <b style="color: var(--text); font-weight: 900">7:45</b></div></div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 18px">
      <h1 style="margin: 0; font-size: 32px; font-weight: 900">Котра година?</h1>
      <div class="timebox-row">
        <div class="timebox h focus" aria-label="Години">8</div>
        <span class="colon">:</span>
        <div class="timebox mm" aria-label="Хвилини">45</div>
      </div>
      <!-- Room for the error lines, kept so nothing moves when they appear. -->
      <div aria-hidden="true" style="min-height: 41px"></div>
      <div class="pad" style="width: 340px">
        <button class="key" type="button">1</button><button class="key" type="button">2</button><button class="key" type="button">3</button>
        <button class="key" type="button">4</button><button class="key" type="button">5</button><button class="key" type="button">6</button>
        <button class="key" type="button">7</button><button class="key" type="button">8</button><button class="key" type="button">9</button>
        <button class="key" type="button" style="grid-column: span 2">0</button>
        <button class="key" type="button" aria-label="Стерти"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5h12v14H8l-6-7z"></path><path d="M12 9l5 6M17 9l-5 6"></path></svg></button>
      </div>
      <button class="btn" type="button" style="width: 340px">Перевірити</button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
