<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Телефон: Який час?</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#f2b84b}a:hover{color:#ffd27a}
</style>
</helmet>
<div class="tc" style="width: 390px; height: 844px; display: flex; flex-direction: column">
  <header class="hdr" style="height: 64px; padding: 0 14px">
    <div class="brand"><svg class="c-icon" viewBox="-100 -100 200 200" aria-hidden="true"><circle class="c-face" r="90"></circle><line class="c-hour" y1="8" y2="-42" transform="rotate(300)"></line><line class="c-min" y1="10" y2="-64" transform="rotate(60)"></line><circle class="c-pin" r="9"></circle></svg></div>
    <div class="hdr-tools" style="gap: 8px">
      <div class="seg" role="group" aria-label="Мова"><button type="button" aria-pressed="true">УК</button><button type="button" aria-pressed="false">EN</button></div>
      <button class="icon-btn" type="button" aria-label="Тема: середня. Змінити" style="padding: 0; width: 48px"><span class="swatch sw-middle" style="width: 26px; height: 26px"></span></button>
      <button class="icon-btn" type="button" aria-label="Вийти" style="padding: 0; width: 48px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h5v16h-5"></path><path d="M9 8l-4 4 4 4"></path><path d="M5 12h11"></path></svg></button>
    </div>
  </header>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
    <div class="dots" style="gap: 8px" aria-label="Прогрес: завдання 4 з 10">
      <span class="dot ok"></span><span class="dot help"></span><span class="dot ok"></span><span class="dot now"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div class="task-no">Завдання 4 з 10 · <svg class="mode-icon teach" viewBox="-100 -100 200 200" aria-hidden="true"><g class="m-rays"><line x1="0" y1="-78" x2="0" y2="-96"></line><line x1="-42" y1="-60" x2="-55" y2="-73"></line><line x1="42" y1="-60" x2="55" y2="-73"></line><line x1="-60" y1="-18" x2="-78" y2="-18"></line><line x1="60" y1="-18" x2="78" y2="-18"></line></g><path class="m-bulb" d="M -28 18 A 46 46 0 1 1 28 18 L 22 40 L -22 40 Z"></path><path class="m-filament" d="M -11 30 L -11 6 L 0 -6 L 11 6 L 11 30"></path><rect class="m-base" x="-24" y="48" width="48" height="12" rx="6"></rect><rect class="m-base" x="-16" y="66" width="32" height="12" rx="6"></rect></svg>Навчання</div>
  </div>

  <main style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 10px 20px 20px">
    <svg class="clock" viewBox="-100 -100 200 200" role="img" aria-label="Годинник показує 7:45" style="width: 236px; height: 236px">
      <circle class="c-face" r="94"></circle>
      <circle class="c-tick" r="84" stroke-dasharray="1.2 7.5965" stroke-dashoffset="0.6"></circle>
      <circle class="c-tick5" r="84" stroke-dasharray="3 40.982" stroke-dashoffset="1.5"></circle>
      <!-- Where the hands point: the Minute Hand's tick (under the hands) and the Hour Hand's number (below), lit with a glow. -->
      <defs><filter id="glow" filterUnits="userSpaceOnUse" x="-110" y="-110" width="220" height="220"><feGaussianBlur stdDeviation="2.2"></feGaussianBlur></filter></defs>
      <g class="c-lit-tick" transform="rotate(270)"><line class="glow" y1="-90" y2="-79" filter="url(#glow)"></line><line y1="-90" y2="-79"></line></g>
      <text class="c-num" x="33" y="-57.2">1</text><text class="c-num" x="57.2" y="-33">2</text><text class="c-num" x="66" y="0">3</text><text class="c-num" x="57.2" y="33">4</text><text class="c-num" x="33" y="57.2">5</text><text class="c-num" x="0" y="66">6</text><text class="c-num" x="-57.2" y="33">8</text><text class="c-num" x="-66" y="0">9</text><text class="c-num" x="-57.2" y="-33">10</text><text class="c-num" x="-33" y="-57.2">11</text><text class="c-num" x="0" y="-66">12</text>
      <line class="c-hour" y1="10" y2="-45" transform="rotate(232.5)"></line>
      <line class="c-min" y1="14" y2="-70" transform="rotate(270)"></line>
      <!-- The lit number goes on top of everything. -->
      <text class="c-num c-lit-glow" x="-33" y="57.2" filter="url(#glow)" aria-hidden="true">7</text>
      <text class="c-num lit" x="-33" y="57.2">7</text>
      <circle class="c-pin" r="7"></circle>
    </svg>
    <div class="timebox-row" style="grid-template-rows: auto auto; row-gap: 2px; margin-bottom: -9px">
      <div class="timebox h" style="height: 76px; width: 76px; font-size: 46px" aria-label="Години">7</div>
      <span class="colon" style="font-size: 46px">:</span>
      <div class="timebox mm focus" style="height: 76px; width: 120px; font-size: 46px" aria-label="Хвилини">45</div>
      <span class="range h" style="font-size: 14px">1–12</span>
      <span class="range mm" style="font-size: 14px">0–59</span>
    </div>
    <div class="pad" style="width: 100%; gap: 8px">
      <button class="key" type="button" style="height: 54px">1</button><button class="key" type="button" style="height: 54px">2</button><button class="key" type="button" style="height: 54px">3</button>
      <button class="key" type="button" style="height: 54px">4</button><button class="key" type="button" style="height: 54px">5</button><button class="key" type="button" style="height: 54px">6</button>
      <button class="key" type="button" style="height: 54px">7</button><button class="key" type="button" style="height: 54px">8</button><button class="key" type="button" style="height: 54px">9</button>
      <button class="key" type="button" style="height: 54px; grid-column: span 2">0</button>
      <button class="key" type="button" style="height: 54px" aria-label="Стерти"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5h12v14H8l-6-7z"></path><path d="M12 9l5 6M17 9l-5 6"></path></svg></button>
    </div>
    <button class="btn" type="button" style="width: 100%">Перевірити</button>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
