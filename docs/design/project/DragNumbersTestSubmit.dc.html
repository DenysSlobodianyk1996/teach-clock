<!doctype html>
<html lang="uk">
<head>

<title>Розстав числа: Перевірка, усі 12</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>

<style>

a{color:#f2b84b}a:hover{color:#ffd27a}
</style>
</helmet>
<div class="tc" style="width: 1024px; height: 768px; display: flex; flex-direction: column">
  <header class="hdr">
    <div class="brand"><svg viewBox="-100 -100 200 200" aria-hidden="true"><circle class="c-face" r="90"></circle><line class="c-hour" y1="8" y2="-42" transform="rotate(300)"></line><line class="c-min" y1="10" y2="-64" transform="rotate(60)"></line><circle class="c-pin" r="9"></circle></svg>Вчимо годинник</div>
    <div class="hdr-tools">
      <div class="seg" role="group" aria-label="Мова"><button type="button" aria-pressed="true">УК</button><button type="button" aria-pressed="false">EN</button></div>
      <div class="seg" role="group" aria-label="Тема"><button type="button" aria-pressed="true" aria-label="Середня тема"><span class="swatch sw-middle"></span></button><button type="button" aria-pressed="false" aria-label="Темна тема"><span class="swatch sw-dark"></span></button><button type="button" aria-pressed="false" aria-label="Світла тема"><span class="swatch sw-light"></span></button></div>
      <a class="icon-btn" href="LeaveRound.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h5v16h-5"></path><path d="M9 8l-4 4 4 4"></path><path d="M5 12h11"></path></svg>Вийти</a>
    </div>
  </header>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 6px">
    <div class="dots" aria-label="Розставлено 12 з 12">
      <span class="dot" style="background: var(--accent)"></span><span class="dot" style="background: var(--accent)"></span><span class="dot" style="background: var(--accent)"></span><span class="dot" style="background: var(--accent)"></span><span class="dot" style="background: var(--accent)"></span><span class="dot" style="background: var(--accent)"></span><span class="dot" style="background: var(--accent)"></span><span class="dot" style="background: var(--accent)"></span><span class="dot" style="background: var(--accent)"></span><span class="dot" style="background: var(--accent)"></span><span class="dot" style="background: var(--accent)"></span><span class="dot" style="background: var(--accent)"></span>
    </div>
    <div class="task-no">Розставлено 12 з 12 · Перевірка</div>
  </div>

  <main style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: center; padding: 0 48px 28px">
    <div style="display: flex; justify-content: center">
      <svg class="clock" viewBox="-110 -110 220 220" role="img" aria-label="Циферблат з усіма 12 числами" style="width: 440px; height: 440px">
        <circle class="c-face" r="94"></circle>
        <circle class="c-tick5" r="84" stroke-dasharray="3 40.982" stroke-dashoffset="1.5"></circle>
        <circle class="c-tile" cx="0" cy="-66" r="15"></circle><text class="c-tile-num" x="0" y="-66">12</text>
        <circle class="c-tile" cx="33" cy="-57.2" r="15"></circle><text class="c-tile-num" x="33" y="-57.2">1</text>
        <circle class="c-tile" cx="57.2" cy="-33" r="15"></circle><text class="c-tile-num" x="57.2" y="-33">2</text>
        <circle class="c-tile" cx="66" cy="0" r="15"></circle><text class="c-tile-num" x="66" y="0">3</text>
        <circle class="c-tile" cx="57.2" cy="33" r="15"></circle><text class="c-tile-num" x="57.2" y="33">5</text>
        <circle class="c-tile" cx="33" cy="57.2" r="15"></circle><text class="c-tile-num" x="33" y="57.2">4</text>
        <circle class="c-tile" cx="0" cy="66" r="15"></circle><text class="c-tile-num" x="0" y="66">6</text>
        <circle class="c-tile" cx="-33" cy="57.2" r="15"></circle><text class="c-tile-num" x="-33" y="57.2">7</text>
        <circle class="c-tile" cx="-57.2" cy="33" r="15"></circle><text class="c-tile-num" x="-57.2" y="33">8</text>
        <circle class="c-tile" cx="-66" cy="0" r="15"></circle><text class="c-tile-num" x="-66" y="0">9</text>
        <circle class="c-tile" cx="-57.2" cy="-33" r="15"></circle><text class="c-tile-num" x="-57.2" y="-33">10</text>
        <circle class="c-tile" cx="-33" cy="-57.2" r="15"></circle><text class="c-tile-num" x="-33" y="-57.2">11</text>
        <circle class="c-pin" r="7"></circle>
      </svg>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 20px">
      <h1 style="margin: 0; font-size: 32px; font-weight: 900">Усі числа на місцях?</h1>
      <div class="tray" style="width: 300px; min-height: 150px; display: flex; align-items: center; justify-content: center; text-align: center; border: 3px dashed var(--line); background: transparent; color: var(--muted); font-size: 17px; line-height: 1.4">Лоток порожній. Щоб поміняти два числа, перетягни одне на інше.</div>
      <button class="btn" type="button" style="width: 300px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Готово</button>
      <p style="margin: 0; font-size: 15px; color: var(--muted)">Кнопка з’являється, коли всі 12 чисел на циферблаті.</p>
    </div>
  </main>
</div>
</x-dc>
