<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Телефон: Розстав години 13–24 · Навчання: помилка</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#f2b84b}a:hover{color:#ffd27a}
</style>
</helmet>
<div class="tc dark" style="width: 360px; height: 640px; display: flex; flex-direction: column">
  <header class="hdr" style="height: 64px; padding: 0 14px">
    <div class="brand"><svg class="c-icon" viewBox="-100 -100 200 200" aria-hidden="true"><circle class="c-face" r="90"></circle><line class="c-hour" y1="8" y2="-42" transform="rotate(300)"></line><line class="c-min" y1="10" y2="-64" transform="rotate(60)"></line><circle class="c-pin" r="9"></circle></svg></div>
    <div class="hdr-tools" style="gap: 8px">
      <button class="icon-btn circle" type="button" aria-label="Мова: Українська">УК</button>
      <button class="icon-btn circle" type="button" aria-label="Тема: темна"><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 3.6a8.6 8.6 0 1 0 4.9 13.6A7 7 0 0 1 15.5 3.6Z"></path></svg></button>
      <button class="icon-btn" type="button" aria-label="Вийти" style="padding: 0; width: 48px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h5v16h-5"></path><path d="M9 8l-4 4 4 4"></path><path d="M5 12h11"></path></svg></button>
    </div>
  </header>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
    <div class="dots" style="gap: 6px" aria-label="Прогрес: на місці 4 з 12 чисел">
      <span class="dot ok" style="width: 16px; height: 16px"></span><span class="dot ok" style="width: 16px; height: 16px"></span><span class="dot help" style="width: 16px; height: 16px"></span><span class="dot ok" style="width: 16px; height: 16px"></span><span class="dot" style="width: 16px; height: 16px"></span><span class="dot" style="width: 16px; height: 16px"></span><span class="dot" style="width: 16px; height: 16px"></span><span class="dot" style="width: 16px; height: 16px"></span><span class="dot" style="width: 16px; height: 16px"></span><span class="dot" style="width: 16px; height: 16px"></span><span class="dot" style="width: 16px; height: 16px"></span><span class="dot" style="width: 16px; height: 16px"></span>
    </div>
    <div class="task-no">На місці 4 з 12 · <svg class="mode-icon teach" viewBox="-100 -100 200 200" aria-hidden="true"><g class="m-rays"><line x1="0" y1="-78" x2="0" y2="-96"></line><line x1="-42" y1="-60" x2="-55" y2="-73"></line><line x1="42" y1="-60" x2="55" y2="-73"></line><line x1="-60" y1="-18" x2="-78" y2="-18"></line><line x1="60" y1="-18" x2="78" y2="-18"></line></g><path class="m-bulb" d="M -28 18 A 46 46 0 1 1 28 18 L 22 40 L -22 40 Z"></path><path class="m-filament" d="M -11 30 L -11 6 L 0 -6 L 11 6 L 11 30"></path><rect class="m-base" x="-24" y="48" width="48" height="12" rx="6"></rect><rect class="m-base" x="-16" y="66" width="32" height="12" rx="6"></rect></svg>Навчання</div>
  </div>

  <main style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 4px 20px 12px">
    <svg class="clock" viewBox="-110 -110 220 220" role="img" aria-label="Циферблат, на місці 4 з 12 чисел" style="width: 260px; height: 260px">
      <circle class="c-face" r="94"></circle>
      <circle class="c-tick5" r="84" stroke-dasharray="3 40.982" stroke-dashoffset="1.5"></circle>
      <g class="hour-badges" aria-hidden="true"><circle class="c-badge" cx="20" cy="-34.6" r="8.5"></circle><text class="c-badge-num" x="20" y="-34.6">1</text><circle class="c-badge" cx="34.6" cy="-20" r="8.5"></circle><text class="c-badge-num" x="34.6" y="-20">2</text><circle class="c-badge" cx="40" cy="0" r="8.5"></circle><text class="c-badge-num" x="40" y="0">3</text><circle class="c-badge" cx="34.6" cy="20" r="8.5"></circle><text class="c-badge-num" x="34.6" y="20">4</text><circle class="c-badge" cx="20" cy="34.6" r="8.5"></circle><text class="c-badge-num" x="20" y="34.6">5</text><circle class="c-badge" cx="0" cy="40" r="8.5"></circle><text class="c-badge-num" x="0" y="40">6</text><circle class="c-badge" cx="-20" cy="34.6" r="8.5"></circle><text class="c-badge-num" x="-20" y="34.6">7</text><circle class="c-badge" cx="-34.6" cy="20" r="8.5"></circle><text class="c-badge-num" x="-34.6" y="20">8</text><circle class="c-badge" cx="-40" cy="0" r="8.5"></circle><text class="c-badge-num" x="-40" y="0">9</text><circle class="c-badge" cx="-34.6" cy="-20" r="8.5"></circle><text class="c-badge-num" x="-34.6" y="-20">10</text><circle class="c-badge" cx="-20" cy="-34.6" r="8.5"></circle><text class="c-badge-num" x="-20" y="-34.6">11</text><circle class="c-badge" cx="0" cy="-40" r="8.5"></circle><text class="c-badge-num" x="0" y="-40">12</text></g>
      <circle class="c-slot" cx="33" cy="-57.2" r="14"></circle><circle class="c-slot" cx="57.2" cy="-33" r="14"></circle><circle class="c-slot" cx="57.2" cy="33" r="14"></circle><circle class="c-slot" cx="33" cy="57.2" r="14"></circle><circle class="c-slot" cx="-33" cy="57.2" r="14"></circle><circle class="c-slot" cx="-57.2" cy="33" r="14"></circle><circle class="c-slot" cx="-57.2" cy="-33" r="14"></circle><circle class="c-slot" cx="-33" cy="-57.2" r="14"></circle>
      <circle class="c-tile" cx="0" cy="-66" r="15"></circle><text class="c-tile-num" x="0" y="-66">24</text>
      <circle class="c-tile" cx="66" cy="0" r="15"></circle><text class="c-tile-num" x="66" y="0">15</text>
      <circle class="c-tile" cx="0" cy="66" r="15"></circle><text class="c-tile-num" x="0" y="66">18</text>
      <circle class="c-tile" cx="-66" cy="0" r="15"></circle><text class="c-tile-num" x="-66" y="0">21</text>
      <circle class="c-pin" r="7"></circle>
    </svg>
    <div style="display: flex; align-items: center; justify-content: center; gap: 10px"><h1 style="margin: 0; font-size: 22px; font-weight: 900">Розстав числа по місцях</h1><button class="icon-btn" type="button" aria-label="Показати заповнений годинник" style="flex: none; padding: 0; width: 48px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3.2"></circle></svg></button></div>
    <div class="tray" style="--number-size: 40px; width: 100%; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; padding: 8px; justify-items: center" aria-label="Числа">
      <button class="tile" type="button" style="outline: 3px solid var(--hour); outline-offset: 2px">19</button><button class="tile" type="button">14</button><button class="tile" type="button">23</button><button class="tile" type="button">16</button><button class="tile" type="button">22</button><button class="tile" type="button">13</button>
      <button class="tile" type="button">20</button><button class="tile" type="button">17</button>
    </div>
    <p style="margin: 0; font-size: 14px; color: var(--muted); text-align: center">Перетягни число на його місце або торкнись числа, а потім місця.</p>
  </main>
  <!-- Teach, a wrong drop: the popup lights the number's own slot in green, between its two
       neighbours. Got it closes it (the number stays on the tray, ringed); Set correct answer puts
       it on its slot with a green flash. Nothing is added around the face, so it never moves. -->
  <div class="scrim">
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="wrong-title" style="width: calc(100% - 32px); padding: 26px 20px">
      <h2 id="wrong-title">Майже! Правильно так:</h2>
      <svg class="clock" viewBox="-110 -110 220 220" role="img" aria-label="19 стоїть між 18 і 20" style="width: 150px; height: 150px">
          <circle class="c-face" r="94"></circle>
          <circle class="c-tick5" r="84" stroke-dasharray="3 40.982" stroke-dashoffset="1.5"></circle>
          <g class="hour-badges" aria-hidden="true"><circle class="c-badge" cx="20" cy="-34.7" r="10"></circle><text class="c-badge-num" x="20" y="-34.7">1</text><circle class="c-badge" cx="34.7" cy="-20" r="10"></circle><text class="c-badge-num" x="34.7" y="-20">2</text><circle class="c-badge" cx="40" cy="0" r="10"></circle><text class="c-badge-num" x="40" y="0">3</text><circle class="c-badge" cx="34.7" cy="20" r="10"></circle><text class="c-badge-num" x="34.7" y="20">4</text><circle class="c-badge" cx="20" cy="34.7" r="10"></circle><text class="c-badge-num" x="20" y="34.7">5</text><circle class="c-badge" cx="0" cy="40" r="10"></circle><text class="c-badge-num" x="0" y="40">6</text><circle class="c-badge" cx="-20" cy="34.7" r="10"></circle><text class="c-badge-num" x="-20" y="34.7">7</text><circle class="c-badge" cx="-34.7" cy="20" r="10"></circle><text class="c-badge-num" x="-34.7" y="20">8</text><circle class="c-badge" cx="-40" cy="0" r="10"></circle><text class="c-badge-num" x="-40" y="0">9</text><circle class="c-badge" cx="-34.7" cy="-20" r="10"></circle><text class="c-badge-num" x="-34.7" y="-20">10</text><circle class="c-badge" cx="-20" cy="-34.7" r="10"></circle><text class="c-badge-num" x="-20" y="-34.7">11</text><circle class="c-badge" cx="0" cy="-40" r="10"></circle><text class="c-badge-num" x="0" y="-40">12</text></g>
          <circle class="c-slot" cx="33" cy="-57.2" r="14"></circle>
          <circle class="c-slot" cx="57.2" cy="-33" r="14"></circle>
          <circle class="c-slot" cx="66" cy="0" r="14"></circle>
          <circle class="c-slot" cx="57.2" cy="33" r="14"></circle>
          <circle class="c-slot" cx="33" cy="57.2" r="14"></circle>
          <circle class="c-tile" cx="0" cy="66" r="15"></circle><text class="c-tile-num" x="0" y="66">18</text>
          <circle class="c-tile" cx="-33" cy="57.2" r="15" style="fill: var(--good)"></circle><text class="c-tile-num" x="-33" y="57.2">19</text>
          <circle class="c-tile" cx="-57.2" cy="33" r="15"></circle><text class="c-tile-num" x="-57.2" y="33">20</text>
          <circle class="c-slot" cx="-66" cy="0" r="14"></circle>
          <circle class="c-slot" cx="-57.2" cy="-33" r="14"></circle>
          <circle class="c-slot" cx="-33" cy="-57.2" r="14"></circle>
          <circle class="c-slot" cx="0" cy="-66" r="14"></circle>
          <circle class="c-pin" r="7"></circle>
      </svg>
      <p>19 стоїть між 18 і 20</p>
      <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; width: 100%">
        <button class="btn" type="button" style="flex: 1 1 auto; padding: 0 22px; font-size: 19px; min-height: 54px; background: var(--bg-deep); color: var(--text)">Постав правильну відповідь</button>
        <button class="btn" type="button" style="flex: 1 1 auto; padding: 0 22px; font-size: 19px; min-height: 54px">Зрозуміло</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":640}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
