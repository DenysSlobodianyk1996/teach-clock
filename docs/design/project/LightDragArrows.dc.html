<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Світла тема: Постав стрілки</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#f2b84b}a:hover{color:#ffd27a}
</style>
</helmet>
<div class="tc light" style="width: 1024px; height: 768px; display: flex; flex-direction: column">
  <header class="hdr">
    <div class="brand"><svg class="c-icon" viewBox="-100 -100 200 200" aria-hidden="true"><circle class="c-face" r="90"></circle><line class="c-hour" y1="8" y2="-42" transform="rotate(300)"></line><line class="c-min" y1="10" y2="-64" transform="rotate(60)"></line><circle class="c-pin" r="9"></circle></svg>Вчимо годинник</div>
    <div class="hdr-tools">
      <div class="seg" role="group" aria-label="Мова"><button type="button" aria-pressed="true">УК</button><button type="button" aria-pressed="false">EN</button></div>
      <div class="seg" role="group" aria-label="Тема"><button type="button" aria-pressed="false" aria-label="Середня тема"><span class="swatch sw-middle"></span></button><button type="button" aria-pressed="false" aria-label="Темна тема"><span class="swatch sw-dark"></span></button><button type="button" aria-pressed="true" aria-label="Світла тема"><span class="swatch sw-light"></span></button></div>
      <a class="icon-btn" href="LeaveRound.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h5v16h-5"></path><path d="M9 8l-4 4 4 4"></path><path d="M5 12h11"></path></svg>Вийти</a>
    </div>
  </header>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 6px">
    <div class="dots" aria-label="Прогрес: завдання 3 з 10">
      <span class="dot ok"></span><span class="dot help"></span><span class="dot now"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div class="task-no">Завдання 3 з 10 · <svg class="mode-icon teach" viewBox="-100 -100 200 200" aria-hidden="true"><g class="m-rays"><line x1="0" y1="-78" x2="0" y2="-96"></line><line x1="-42" y1="-60" x2="-55" y2="-73"></line><line x1="42" y1="-60" x2="55" y2="-73"></line><line x1="-60" y1="-18" x2="-78" y2="-18"></line><line x1="60" y1="-18" x2="78" y2="-18"></line></g><path class="m-bulb" d="M -28 18 A 46 46 0 1 1 28 18 L 22 40 L -22 40 Z"></path><path class="m-filament" d="M -11 30 L -11 6 L 0 -6 L 11 6 L 11 30"></path><rect class="m-base" x="-24" y="48" width="48" height="12" rx="6"></rect><rect class="m-base" x="-16" y="66" width="32" height="12" rx="6"></rect></svg>Навчання</div>
  </div>

  <main style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: center; padding: 0 48px 28px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 16px">
      <svg class="clock" viewBox="-110 -110 220 220" role="img" aria-label="Годинник зі стрілками на 4:15. Перетягни стрілки." style="width: 420px; height: 420px">
        <circle class="c-face" r="94"></circle>
        <circle class="c-tick" r="84" stroke-dasharray="1.2 7.5965" stroke-dashoffset="0.6"></circle>
        <circle class="c-tick5" r="84" stroke-dasharray="3 40.982" stroke-dashoffset="1.5"></circle>
        <!-- Where the hands point: the Minute Hand's tick (under the hands) and the Hour Hand's number (below), lit with a glow. -->
        <defs><filter id="glow" filterUnits="userSpaceOnUse" x="-110" y="-110" width="220" height="220"><feGaussianBlur stdDeviation="2.2"></feGaussianBlur></filter></defs>
        <g class="c-lit-tick" transform="rotate(90)"><line class="glow" y1="-90" y2="-79" filter="url(#glow)"></line><line y1="-90" y2="-79"></line></g>
        <line class="c-hour" y1="10" y2="-45" transform="rotate(97.5)" style="opacity: 0.25"></line>
        <path d="M 39.3 2.9 A 40 40 0 0 1 32.9 22.7" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 7"></path>
        <g transform="rotate(118)"><line class="c-hour" y1="10" y2="-45"></line><circle class="c-grip h" cx="0" cy="-45" r="7"></circle></g>
        <g transform="rotate(90)"><line class="c-min" y1="14" y2="-70"></line><circle class="c-grip m" cx="0" cy="-70" r="7"></circle></g>
        <!-- Every number goes over the hands and grips, so a grip never hides one. -->
        <text class="c-num" x="33" y="-57.2">1</text><text class="c-num" x="57.2" y="-33">2</text><text class="c-num" x="66" y="0">3</text><text class="c-num" x="33" y="57.2">5</text><text class="c-num" x="0" y="66">6</text><text class="c-num" x="-33" y="57.2">7</text><text class="c-num" x="-57.2" y="33">8</text><text class="c-num" x="-66" y="0">9</text><text class="c-num" x="-57.2" y="-33">10</text><text class="c-num" x="-33" y="-57.2">11</text><text class="c-num" x="0" y="-66">12</text>
        <!-- The lit number goes on top of everything. -->
        <text class="c-num c-lit-glow" x="57.2" y="33" filter="url(#glow)" aria-hidden="true">4</text>
        <text class="c-num lit" x="57.2" y="33">4</text>
        <circle class="c-pin" r="7"></circle>
      </svg>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 20px">
      <h1 style="margin: 0; font-size: 32px; font-weight: 900">Постав стрілки на</h1>
      <div class="card" style="padding: 18px 46px; background: var(--face); color: var(--num)"><div class="big-time" style="font-size: 96px">4:15</div></div>
      <div style="display: flex; flex-direction: column; gap: 10px; font-size: 17px; color: var(--muted)">
        <div style="display: flex; align-items: center; gap: 12px"><svg viewBox="0 0 60 20" aria-hidden="true" style="width: 60px; height: 20px"><line class="c-hour" x1="8" y1="10" x2="40" y2="10"></line></svg>Коротка — години</div>
        <div style="display: flex; align-items: center; gap: 12px"><svg viewBox="0 0 60 20" aria-hidden="true" style="width: 60px; height: 20px"><line class="c-min" x1="6" y1="10" x2="56" y2="10"></line></svg>Довга — хвилини</div>
      </div>
      <button class="btn" type="button" style="width: 340px">Перевірити</button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
