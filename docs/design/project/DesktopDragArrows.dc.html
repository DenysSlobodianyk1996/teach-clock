<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Комп’ютер: Постав стрілки</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#f2b84b}a:hover{color:#ffd27a}
</style>
</helmet>
<div class="tc" style="width: 1440px; height: 900px; background: var(--bg-deep)">
  <header class="hdr" style="padding: 0 40px">
    <div class="brand"><svg viewBox="-100 -100 200 200" aria-hidden="true"><circle class="c-face" r="90"></circle><line class="c-hour" y1="8" y2="-42" transform="rotate(300)"></line><line class="c-min" y1="10" y2="-64" transform="rotate(60)"></line><circle class="c-pin" r="9"></circle></svg>Вчимо годинник</div>
    <div class="hdr-tools">
      <div class="seg" role="group" aria-label="Мова"><button type="button" aria-pressed="true">УК</button><button type="button" aria-pressed="false">EN</button></div>
      <div class="seg" role="group" aria-label="Тема"><button type="button" aria-pressed="true" aria-label="Середня тема"><span class="swatch sw-middle"></span></button><button type="button" aria-pressed="false" aria-label="Темна тема"><span class="swatch sw-dark"></span></button><button type="button" aria-pressed="false" aria-label="Світла тема"><span class="swatch sw-light"></span></button></div>
      <a class="icon-btn" href="LeaveRound.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h5v16h-5"></path><path d="M9 8l-4 4 4 4"></path><path d="M5 12h11"></path></svg>Вийти</a>
    </div>
  </header>
  <div class="stage-wrap">
    <div class="stage" style="background: var(--bg); display: flex; flex-direction: column; padding: 24px 48px 32px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <div class="dots" aria-label="Прогрес: завдання 5 з 10">
          <span class="dot ok"></span><span class="dot ok"></span><span class="dot help"></span><span class="dot ok"></span><span class="dot ok"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
        <div class="task-no">Завдання 5 з 10 · Навчання · 5 хв</div>
      </div>
      <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: center">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px">
          <svg class="clock" viewBox="-110 -110 220 220" role="img" aria-label="Стрілки показують 8:20" style="width: 420px; height: 420px">
            <circle class="c-face" r="94" style="stroke: var(--good)"></circle>
            <circle class="c-tick" r="84" stroke-dasharray="1.2 7.5965" stroke-dashoffset="0.6"></circle>
            <circle class="c-tick5" r="84" stroke-dasharray="3 40.982" stroke-dashoffset="1.5"></circle>
            <text class="c-num" x="33" y="-57.2">1</text><text class="c-num" x="57.2" y="-33">2</text><text class="c-num" x="66" y="0">3</text><text class="c-num" x="57.2" y="33">4</text><text class="c-num" x="33" y="57.2">5</text><text class="c-num" x="0" y="66">6</text><text class="c-num" x="-33" y="57.2">7</text><text class="c-num" x="-57.2" y="33">8</text><text class="c-num" x="-66" y="0">9</text><text class="c-num" x="-57.2" y="-33">10</text><text class="c-num" x="-33" y="-57.2">11</text><text class="c-num" x="0" y="-66">12</text>
            <g transform="rotate(250)"><line class="c-hour" y1="10" y2="-45"></line><circle class="c-grip h" cx="0" cy="-45" r="9"></circle></g>
            <g transform="rotate(120)"><line class="c-min" y1="14" y2="-70"></line><circle class="c-grip m" cx="0" cy="-74" r="11"></circle></g>
            <circle class="c-pin" r="7"></circle>
          </svg>
      <!-- The Hint's space is kept from the first Task, so the clock never moves when it appears. -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; visibility: hidden" aria-hidden="true"><button class="btn btn-help" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"></path></svg>Постав правильну відповідь</button><div style="font-size: 18px; color: var(--muted)">Підказка: <b style="color: var(--text); font-weight: 900">8:20</b></div></div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 22px">
          <h1 style="margin: 0; font-size: 32px; font-weight: 900">Постав стрілки на</h1>
          <div class="card" style="padding: 18px 46px; background: var(--face); color: var(--num)"><div class="big-time" style="font-size: 96px">8:20</div></div>
          <div class="toast" role="status" style="background: var(--good); color: #173322"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Правильно! Далі…</div>
          <button class="btn" type="button" disabled style="width: 340px">Перевірити</button>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
