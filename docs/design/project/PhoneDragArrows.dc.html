<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Телефон: Постав стрілки</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#f2b84b}a:hover{color:#ffd27a}
</style>
</helmet>
<div class="tc" style="width: 390px; height: 844px; display: flex; flex-direction: column">
  <header class="hdr" style="height: 64px; padding: 0 14px">
    <div class="brand"><svg viewBox="-100 -100 200 200" aria-hidden="true"><circle class="c-face" r="90"></circle><line class="c-hour" y1="8" y2="-42" transform="rotate(300)"></line><line class="c-min" y1="10" y2="-64" transform="rotate(60)"></line><circle class="c-pin" r="9"></circle></svg></div>
    <div class="hdr-tools" style="gap: 8px">
      <div class="seg" role="group" aria-label="Мова"><button type="button" aria-pressed="true">УК</button><button type="button" aria-pressed="false">EN</button></div>
      <button class="icon-btn" type="button" aria-label="Тема: середня. Змінити" style="padding: 0; width: 48px"><span class="swatch sw-middle" style="width: 26px; height: 26px"></span></button>
      <button class="icon-btn" type="button" aria-label="Вийти" style="padding: 0; width: 48px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h5v16h-5"></path><path d="M9 8l-4 4 4 4"></path><path d="M5 12h11"></path></svg></button>
    </div>
  </header>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
    <div class="dots" style="gap: 8px" aria-label="Прогрес: завдання 3 з 10">
      <span class="dot ok"></span><span class="dot ok"></span><span class="dot now"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div class="task-no">Завдання 3 з 10 · Навчання</div>
  </div>

  <main style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 4px 20px 20px">
    <div style="position: relative">
      <svg class="clock" viewBox="-100 -100 200 200" role="img" aria-label="Стрілки показують 4:10, хвилинну стрілку тягнуть" style="width: 350px; height: 350px">
        <circle class="c-face" r="94"></circle>
        <circle class="c-tick" r="84" stroke-dasharray="1.2 7.5965" stroke-dashoffset="0.6"></circle>
        <circle class="c-tick5" r="84" stroke-dasharray="3 40.982" stroke-dashoffset="1.5"></circle>
        <text class="c-num" x="33" y="-57.2">1</text><text class="c-num" x="57.2" y="-33">2</text><text class="c-num" x="66" y="0">3</text><text class="c-num" x="57.2" y="33">4</text><text class="c-num" x="33" y="57.2">5</text><text class="c-num" x="0" y="66">6</text><text class="c-num" x="-33" y="57.2">7</text><text class="c-num" x="-57.2" y="33">8</text><text class="c-num" x="-66" y="0">9</text><text class="c-num" x="-57.2" y="-33">10</text><text class="c-num" x="-33" y="-57.2">11</text><text class="c-num" x="0" y="-66">12</text>
        <g transform="rotate(125)"><line class="c-hour" y1="10" y2="-45"></line><circle class="c-grip h" cx="0" cy="-45" r="9"></circle></g>
        <g transform="rotate(60)"><line class="c-min" y1="14" y2="-70"></line><circle class="c-grip m" cx="0" cy="-70" r="11" style="fill: var(--accent)"></circle></g>
        <g class="c-target minute" transform="rotate(60)"><circle cy="-84" r="8"></circle></g>
        <circle class="c-pin" r="7"></circle>
      </svg>
      <svg aria-hidden="true" viewBox="0 0 24 24" style="position: absolute; left: 273px; top: 109px; width: 40px; height: 40px"><path d="M5 3l14 8-6 2 4 7-3 1.5-4-7-5 4z" style="fill: #fffaf0; stroke: #2a2633; stroke-width: 1.5; stroke-linejoin: round"></path></svg>
    </div>
    <div class="card" style="padding: 10px 30px; background: var(--face); color: var(--num)"><div class="big-time" style="font-size: 56px">4:15</div></div>
    <div style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: var(--muted)">
      <div style="display: flex; align-items: center; gap: 12px"><svg viewBox="0 0 60 20" aria-hidden="true" style="width: 44px; height: 20px"><line class="c-hour" x1="8" y1="10" x2="40" y2="10"></line></svg>Коротка — години</div>
      <div style="display: flex; align-items: center; gap: 12px"><svg viewBox="0 0 60 20" aria-hidden="true" style="width: 44px; height: 20px"><line class="c-min" x1="6" y1="10" x2="56" y2="10"></line></svg>Довга — хвилини</div>
    </div>
    <button class="btn" type="button" style="width: 340px">Перевірити</button>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
